name: Build ROMA APK

on:
  workflow_dispatch:
  push:
    paths:
      - "roma_boutique_drive.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Prepare web app
        run: |
          mkdir -p www assets
          unzip -o "roma_boutique_drive.zip" -d extracted
          cp -R extracted/roma_boutique/. www/
          test -f www/index.html
          test -f www/drive-bridge-entry.js
          cp www/icon-roma.png assets/icon-only.png
          cp www/icon-roma.png assets/splash.png

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/status-bar @capacitor/local-notifications @capawesome/capacitor-google-sign-in
          npm install --save-dev @capacitor/cli @capacitor/assets esbuild
          npx cap init "ROMA" "com.romaboutique.app" --web-dir=www
          python3 - <<'PY'
          import json
          from pathlib import Path
          config_path = Path("capacitor.config.json")
          config = json.loads(config_path.read_text())
          config.setdefault("plugins", {}).setdefault("CapacitorHttp", {})["enabled"] = True
          config_path.write_text(json.dumps(config, indent=2) + "\n")
          print("CapacitorHttp habilitado para consultas HTTPS nativas")
          PY
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          data = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if permission not in data:
              data = data.replace("    <application", permission + "\n    <application", 1)
          manifest.write_text(data)
          PY
          npx capacitor-assets generate --android
          npx esbuild www/drive-bridge-entry.js --bundle --platform=browser --format=iife --outfile=www/drive-bridge.js
          npx cap sync android

      - name: Apply ROMA original icon to Android launcher
        run: |
          test -d extracted/roma_boutique/android-icon-resources
          test -d android/app/src/main/res
          cp -R extracted/roma_boutique/android-icon-resources/. android/app/src/main/res/
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -f android/app/src/main/res/drawable-nodpi/roma_launcher_art.png

      - name: Set monotonically increasing Android versionCode
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("No se encontró el archivo Gradle de la aplicación")
          data = gradle.read_text()
          pattern = r'(?m)^(\s*versionCode\s*=?\s*)\d+(\s*(?://.*)?$)'
          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + 'Integer.parseInt(System.getenv("BUILD_NUMBER") ?: "1")' + m.group(2),
              data,
              count=1
          )
          if count != 1:
              raise SystemExit("No se pudo actualizar versionCode automáticamente")
          # Fijar la versión visible en Android; conservar versionCode incremental.
          name_pattern = r'(?m)^(\s*versionName\s*=?\s*)["\'][^"\']+["\']'
          updated, name_count = re.subn(name_pattern, lambda m: m.group(1) + '"1.0.1"', updated, count=1)
          if name_count != 1:
              raise SystemExit("No se pudo establecer versionName 1.0.1")
          gradle.write_text(updated)
          print("versionCode actualizado:", os.environ["BUILD_NUMBER"])
          print("versionName actualizado: 1.0.1")
          PY

      - name: Decode permanent ROMA signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/roma-release.jks
          test -s android/app/roma-release.jks

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/roma-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload signed ROMA APK
        uses: actions/upload-artifact@v4
        with:
          name: ROMA-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
